[package]
name = "mememarkets"
version = "0.1.0"
description = "Yes or no prediction markets for Solana memecoins, bets in USDC"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mememarkets"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
short-time = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = "=0.31.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
